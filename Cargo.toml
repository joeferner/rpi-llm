[package]
name = "rpi-llm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["engine"]

[dependencies]
# The model side: file formats and inference, kept free of hardware so it
# can be tested on the host (`make test`).
rpi-llm-engine = { path = "engine" }
# The chip feature selects the SoC's peripheral memory map. None is a
# default, because there is no sensible default chip; this one is for the
# Raspberry Pi 5 (preliminary). `multicore` starts cores 1-3, which on the
# Pi 5 the firmware does through PSCI.
rpi-hal = { version = "0.10", features = ["bcm2712", "multicore"] }
# The bring-up every board does: the console and `logln!`, the heap the
# weights live on, and the card's FAT volume they are read from. Each
# capability is a feature; see https://docs.rs/rpi-kickstart.
rpi-kickstart = { version = "0.4", features = ["console", "heap", "storage", "bcm2712"] }
# The filesystem under rpi-kickstart's `storage`, named here for its
# `BlockDevice` trait, which the loader is generic over. The version has
# to be the one rpi-kickstart and rpi-hal's `SdBlockDevice` use, or the
# card's device implements a different crate's trait.
resident-fat = { version = "0.3", default-features = false }
# The lock around the UART that the console and the terminal output
# (progress lines, streamed tokens) share. rpi-hal's `rt` supplies the
# implementation.
critical-section = "1.2"
# Hands the console its sink for `'static`, without a `static mut`.
static_cell = "2.1"

# TEMPORARY, until the next rpi-hal and rpi-kickstart releases: rpi-hal
# 0.10 does not build `rpi_hal::mem` for the Pi 5, which rpi-kickstart's
# `heap` needs, nor `multicore`, and rpi-kickstart 0.4 has no `bcm2712`
# feature, which gives its heap the RAM above the first gigabyte. Remove
# this once the releases with them are out.
[patch.crates-io]
rpi-hal = { path = "../rpi-hal/hal" }
rpi-kickstart = { path = "../rpi-hal/kickstart" }

# There is no unwinder on bare metal.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
